# Configuração do CleanEats API.
# Nenhum segredo aqui: tudo vem de variáveis de ambiente (veja backend/.env.example)
# ou de application-local.yml (ignorado pelo git).
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: cleaneats-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:./application-local.yml
  datasource:
    # Supabase > Project Settings > Database > Connection string (Session pooler, porta 5432)
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USER:postgres}
    password: ${SUPABASE_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # o schema é versionado em supabase/migrations
    properties:
      hibernate:
        jdbc:
          time_zone: America/Recife
  jackson:
    time-zone: America/Recife

server:
  port: ${PORT:8080}

cleaneats:
  supabase:
    url: ${SUPABASE_URL:http://localhost:54321}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173}
  supabase-servico:
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
  nutribot:
    api-key: ${ANTHROPIC_API_KEY:}
    modelo: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
  email:
    resend-api-key: ${RESEND_API_KEY:}
    remetente: ${EMAIL_REMETENTE:CleanEats <onboarding@resend.dev>}
    redirecionar-para: ${EMAIL_REDIRECIONAR_PARA:}
  entrega:
    segundos-ate-sair: ${ENTREGA_SEGUNDOS_ATE_SAIR:20}
    segundos-ate-entregar: ${ENTREGA_SEGUNDOS_ATE_ENTREGAR:40}
  pagamento:
    mercadopago-access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
    mercadopago-public-key: ${MERCADOPAGO_PUBLIC_KEY:}
    chave-pix-demo: ${PIX_CHAVE_DEMO:pagamentos@cleaneats.com.br}
