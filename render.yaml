# Blueprint do Render para a API (Dashboard > New > Blueprint > este repositório)
services:
  - type: web
    name: cleaneats-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free               # hiberna após 15 min sem uso: abrir /api/saude 2 min antes de apresentar
    region: oregon
    healthCheckPath: /api/saude
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: CORS_ORIGENS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: NUTRIBOT_PROVEDOR
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELOS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
      - key: EMAIL_REDIRECIONAR_PARA
        sync: false
